name: Penalty Watch

on:
  schedule:
    # Fri, Sat, Sun (UTC) only, every 10 min. GitHub may delay scheduled runs by several minutes.
    - cron: "*/10 * * * 5,6,0"
  workflow_dispatch:
    inputs:
      send_test:
        description: "Only send a Telegram test message"
        type: boolean
        default: false
      replay_session_key:
        description: "Replay a PAST session (OpenF1 session_key). Ignores age and dedupe, sends max 5 lines"
        required: false
        default: ""

concurrency:
  group: penalty-watch
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Restore seen-messages state
        uses: actions/cache@v4
        with:
          path: state
          key: penalty-seen-${{ github.run_id }}
          restore-keys: |
            penalty-seen-

      - name: Ensure state dir
        run: mkdir -p state

      - name: Poll OpenF1 race control and alert Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Optional: only needed if live OpenF1 data requires an account
          OPENF1_USERNAME: ${{ secrets.OPENF1_USERNAME }}
          OPENF1_PASSWORD: ${{ secrets.OPENF1_PASSWORD }}
          SEND_TEST: ${{ inputs.send_test }}
          SESSION_KEY: ${{ inputs.replay_session_key }}
          REPLAY: ${{ inputs.replay_session_key != '' }}
        run: python3 scripts/penalty_watch.py

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        # bun.lock (Oct 1) and package-lock.json (Oct 14) predate recent
        # package.json dependency changes; resolve fresh from package.json in CI.
        # The repo's 24h supply-chain guard (minimumReleaseAge) can block fresh
        # resolution when frequent publishers (TanStack/Vite) shipped <24h ago;
        # retry once without the guard, loudly, in this throwaway CI sandbox only.
        run: |
          rm -f bun.lock package-lock.json
          bun install || (echo '### bun install failed — retrying without the 24h supply-chain guard (CI sandbox only) ###' && rm -f bunfig.toml && bun install)

      - name: Type-check (tsc --noEmit)
        # On failure, surface the TS errors as annotations (raw logs need auth).
        run: |
          set +e
          bun run typecheck > typecheck.log 2>&1
          status=$?
          if [ $status -ne 0 ]; then
            { grep -E "error TS" typecheck.log; echo "----- tail -----"; tail -n 16 typecheck.log; } | grep -v "^--$" | head -n 30 | cut -c1-220 | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::TSC: ${line//%/%25}"
            done
            exit $status
          fi

      - name: Contract tests (characterization)
        run: |
          set +e
          node --test tests/characterization.test.mjs > char.log 2>&1
          status=$?
          if [ $status -ne 0 ]; then
            { grep -E "not ok|AssertionError|failureType" -B2 -A8 char.log; echo "----- tail -----"; tail -n 14 char.log; } | grep -v "^--$" | head -n 30 | cut -c1-220 | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::CHAR: ${line//%/%25}"
            done
            exit $status
          fi

      - name: Regression tests (real src modules)
        run: |
          set +e
          bun test tests/modules.test.mjs > modules.log 2>&1
          status=$?
          if [ $status -ne 0 ]; then
            { grep -E "not ok|\(fail\)|error:" -B2 -A8 modules.log; echo "----- tail -----"; tail -n 14 modules.log; } | grep -v "^--$" | head -n 30 | cut -c1-220 | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::MODULES: ${line//%/%25}"
            done
            exit $status
          fi

      - name: Build (vite build)
        # Full production build so bundler-level breakage (vite/nitro/rolldown) is
        # caught in CI. Lovable deploys on push regardless of CI, so a red build
        # here is the early warning that prod is broken. On failure, surface the
        # key error lines as annotations (raw logs need auth to read).
        run: |
          set +e
          bun run build > build.log 2>&1
          status=$?
          if [ $status -ne 0 ]; then
            { grep -B 6 -A 14 -m 1 -iE "server-only|import-protection" build.log; echo "----- tail -----"; tail -n 12 build.log; } | grep -v "^--$" | head -n 36 | cut -c1-220 | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::BUILD: ${line//%/%25}"
            done
            exit $status
          fi
        env:
          SUPABASE_URL: https://ci-placeholder.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-key
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key

      # The auto-format bot keeps the baseline prettier-clean, so lint is
      # now a hard gate: any new error fails the build.
      - name: Lint
        run: |
          set +e
          bun run lint > lint.log 2>&1
          status=$?
          if [ $status -ne 0 ]; then
            { grep -E " error " -B2 -A4 lint.log; echo "----- tail -----"; tail -n 10 lint.log; } | grep -v "^--$" | head -n 30 | cut -c1-220 | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::LINT: ${line//%/%25}"
            done
            exit $status
          fi

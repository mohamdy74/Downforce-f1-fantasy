name: Auto-format

on:
  push:
    branches: [main]
  workflow_dispatch:

# eslint --fix applies the exact same prettier fixes the lint step enforces,
# so after this bot runs the lint baseline is clean and CI can gate on it.
# Formatting-only commits; a GITHUB_TOKEN push does not re-trigger workflows.
permissions:
  contents: write

jobs:
  eslint-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        # Same fresh-resolution strategy as ci.yml (stale lockfiles + 24h guard).
        # On failure, surface key lines as annotations — raw logs need auth.
        run: |
          dump() {
            grep -iE "error|fail|denied|not found" -B2 -A8 "$1" | grep -v "^--$" | head -n 24 | cut -c1-200 | while IFS= read -r l; do
              [ -n "$l" ] && echo "::error::INSTALL: ${l//%/%25}"
            done
            tail -n 8 "$1" | cut -c1-200 | while IFS= read -r l; do
              [ -n "$l" ] && echo "::error::INSTALL-TAIL: ${l//%/%25}"
            done
          }
          { rm -f bun.lock package-lock.json
            bun install || (echo 'retry without the 24h supply-chain guard (CI sandbox only)' && rm -f bunfig.toml && bun install)
          } > /tmp/install.log 2>&1 || { dump /tmp/install.log; exit 1; }

      - name: Apply eslint --fix (prettier formatting only)
        run: |
          dump() {
            grep -iE "error|fail|denied" -B1 -A6 "$1" | grep -v "^--$" | head -n 24 | cut -c1-200 | while IFS= read -r l; do
              [ -n "$l" ] && echo "::error::ESLINT: ${l//%/%25}"
            done
            tail -n 10 "$1" | cut -c1-200 | while IFS= read -r l; do
              [ -n "$l" ] && echo "::error::ESLINT-TAIL: ${l//%/%25}"
            done
          }
          bunx eslint . --fix > /tmp/eslint.log 2>&1 || { dump /tmp/eslint.log; exit 1; }

      - name: Commit + push if anything changed
        # actions/checkout leaves HEAD detached, so the push must use an
        # explicit refspec (HEAD:main). Rebase onto the latest main first so
        # concurrent commits (e.g. from the developer) do not break the push.
        run: |
          dump() {
            tail -n 24 "$1" | cut -c1-200 | while IFS= read -r l; do
              [ -n "$l" ] && echo "::error::PUSH: ${l//%/%25}"
            done
          }
          { git config user.name "df-style-bot"
            git config user.email "actions@users.noreply.github.com"
            if ! git diff --quiet; then
              git add -A
              git commit -m "style: apply eslint --fix (prettier formatting) [auto]"
              git fetch origin main
              if git rebase origin/main; then
                git push origin HEAD:main
                echo "Formatting committed and pushed."
              else
                git rebase --abort
                echo "::error::PUSH: rebase onto latest main conflicted — skipping this auto-format push."
                exit 1
              fi
            else
              echo "Nothing to format — baseline already clean."
            fi
          } > /tmp/push.log 2>&1 || { dump /tmp/push.log; exit 1; }

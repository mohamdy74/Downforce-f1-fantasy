name: Race Reminders
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # Drives the Telegram reminder sweep through the authenticated cron route,
      # then warms up the season-sync queue on /reminders. CRON_SECRET must be
      # set in BOTH GitHub repo secrets AND Lovable Secrets; the cron route
      # rejects requests without the matching Bearer token. The secret goes
      # through env indirection — injecting ${{ secrets.* }} straight into the
      # shell line breaks the command if the value contains quotes, backticks
      # or $ characters (suspected cause of the #97-#111 failure streak).
      - name: POST /api/cron/reminders (Telegram sweep)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set +e
          out=$(curl -4 -sS -L --max-time 150 \
            -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -o /tmp/cron.out -w "%{http_code} %{time_total}" \
            https://downforce.lovable.app/api/cron/reminders 2>/tmp/cron.err)
          status=$?
          echo "curl exit=${status} http+time=${out}"
          if [ $status -ne 0 ]; then
            echo "::error::REMINDERS-CRON: curl exit ${status} — http+time ${out} — $(head -c 180 /tmp/cron.err)"
            exit 1
          fi

      - name: Ping /reminders (season-sync warm-up)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set +e
          out=$(curl -4 -sS -L --max-time 150 \
            -H "x-cron-secret: ${CRON_SECRET}" \
            -o /dev/null -w "%{http_code} %{time_total}" \
            https://downforce.lovable.app/reminders 2>/tmp/curl.err)
          status=$?
          echo "curl exit=${status} http+time=${out}"
          if [ $status -ne 0 ]; then
            echo "::error::REMINDERS-WARMUP: curl exit ${status} — http+time ${out} — $(head -c 180 /tmp/curl.err)"
            exit 1
          fi

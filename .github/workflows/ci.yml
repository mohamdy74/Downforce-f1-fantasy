name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install

      - name: Type-check (tsc --noEmit)
        run: bun run typecheck

      - name: Contract tests (characterization)
        run: node --test tests/characterization.test.mjs

      - name: Regression tests (real src modules)
        run: bun test tests/modules.test.mjs

      - name: Lint (advisory until the baseline is clean)
        run: bun run lint
        continue-on-error: true
